---
- block:
    - name: check
      shell: which docker
      register: shell
      become: true
      changed_when: false

  rescue:
    - set_fact: package=docker
    - include_tasks: "{{ansible_facts.os_family}}.yml"

- name: check
  shell: which docker
  register: shell
  changed_when: false
  become: true
  failed_when:
    - shell.rc != 0

- name: daily docker cleanup
  ansible.builtin.cron:
    name: "[antsable] daily docker cleanup"
    special_time: daily
    job: "docker system prune -f"
  changed_when: false